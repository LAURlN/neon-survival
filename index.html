<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1e21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="An unofficial browser remake of Magic Survival. Survive the horde, learn magic." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Magic Survival Web</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="xp"><div id="xp-fill"></div></div>
      <div id="topbar">
        <span id="level">Lv 1</span>
        <span id="timer">00:00</span>
        <span id="kills">0</span>
        <button id="pause" aria-label="Pause">II</button>
      </div>
      <div id="loadout"></div>
      <div id="announce"></div>
    </div>

    <div id="overlay" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
