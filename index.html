<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06070e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Neon Survival - wire your own weapons on a circuit board and survive the grid." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Neon Survival</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="crt"></div>

    <div id="hud" hidden>
      <div id="xp"><div id="xp-fill"></div></div>
      <div id="topbar">
        <span id="level">Lv 1</span>
        <span id="timer">00:00</span>
        <span id="kills">0</span>
        <button id="circuit" aria-label="Edit circuit">⌬<i id="spares"></i></button>
        <button id="mute" aria-label="Sound" aria-pressed="false">♪</button>
        <button id="pause" aria-label="Pause">II</button>
      </div>
      <div id="announce"></div>
    </div>

    <div id="overlay" hidden></div>
    <div id="editor" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
